  "info": {
    "title": "identity-server",
    "description": "API for Identity Server",
    "version": "1.0",
    "contact": {}
  },
  "tags": [],
  "servers": [],
  "components": {
    "securitySchemes": {
      "bearer": {
        "scheme": "bearer",
        "bearerFormat": "JWT",
        "type": "http"
      }
    },
    "schemas": {
      "CreateTenantDto": {
        "type": "object",
        "properties": {}
      },
      "SetCustomDomainDto": {
        "type": "object",
        "properties": {}
      },
      "TenantBrandingDto": {
        "type": "object",
        "properties": {
          "primaryColor": {
            "type": "string",
            "description": "Primary brand color in hex format",
            "example": "#6366f1",
            "pattern": "^#[0-9A-Fa-f]{6}$"
          },
          "logoUrl": {
            "type": "string",
            "description": "URL to the company logo image",
            "example": "https://cdn.example.com/logo.png"
          },
          "fontFamily": {
            "type": "string",
            "description": "Font family (must be from the approved list)",
            "example": "Inter",
            "enum": [
              "Inter",
              "Roboto",
              "Open Sans",
              "Lato",
              "Poppins",
              "Montserrat",
              "Nunito",
              "Source Sans Pro",
              "Raleway",
              "Ubuntu",
              "system-ui"
            ]
          },
          "headerWeight": {
            "type": "string",
            "description": "Header font weight",
            "enum": [
              "regular",
              "bold"
            ],
            "example": "bold"
          },
          "backgroundStyle": {
            "type": "string",
            "description": "Background style for the login page",
            "enum": [
              "solid",
              "gradient"
            ],
            "example": "solid"
          }
        }
      },
      "RegisterTenantDto": {
        "type": "object",
        "properties": {}
      },
      "UpdateUserDto": {
        "type": "object",
        "properties": {
          "firstName": {
            "type": "string",
            "example": "John"
          },
          "lastName": {
            "type": "string",
            "example": "Doe"
          },
          "displayName": {
            "type": "string",
            "example": "John Doe"
          },
          "phone": {
            "type": "string",
            "example": "+1234567890"
          },
          "avatarUrl": {
            "type": "string",
            "example": "https://example.com/avatar.jpg"
          },
          "timezone": {
            "type": "string",
            "example": "America/New_York"
          },
          "language": {
            "type": "string",
            "example": "en"
          }
        }
      },
      "ChangePasswordDto": {
        "type": "object",
        "properties": {
          "currentPassword": {
            "type": "string",
            "example": "CurrentP@ssw0rd123!"
          },
          "newPassword": {
            "type": "string",
            "example": "NewSecureP@ssw0rd123!"
          }
        },
        "required": [
          "currentPassword",
          "newPassword"
        ]
      },
      "UserStatsDto": {
        "type": "object",
        "properties": {
          "total": {
            "type": "number",
            "example": 150,
            "description": "Total users"
          },
          "active": {
            "type": "number",
            "example": 145,
            "description": "Active users"
          },
          "inactive": {
            "type": "number",
            "example": 5,
            "description": "Inactive users"
          },
          "verified": {
            "type": "number",
            "example": 140,
            "description": "Email verified users"
          },
          "unverified": {
            "type": "number",
            "example": 10,
            "description": "Email unverified users"
          },
          "recentLogins": {
            "type": "number",
            "example": 45,
            "description": "Users logged in last 7 days"
          }
        },
        "required": [
          "total",
          "active",
          "inactive",
          "verified",
          "unverified",
          "recentLogins"
        ]
      },
      "BulkUpdateUsersDto": {
        "type": "object",
        "properties": {
          "userIds": {
            "example": [
              "user-id-1",
              "user-id-2"
            ],
            "description": "User IDs to update",
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "isActive": {
            "type": "boolean",
            "example": true,
            "description": "Set active status"
          }
        },
        "required": [
          "userIds",
          "isActive"
        ]
      },
      "InviteUserDto": {
        "type": "object",
        "properties": {
          "email": {
            "type": "string",
            "example": "jane@acme.com"
          },
          "roleIds": {
            "example": [
              "role-uuid-1"
            ],
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "expiresInDays": {
            "type": "number",
            "example": 7
          }
        },
        "required": [
          "email"
        ]
      },
      "RegisterDto": {
        "type": "object",
        "properties": {
          "email": {
            "type": "string",
            "example": "user@example.com"
          },
          "password": {
            "type": "string",
            "example": "SecureP@ssw0rd123!"
          },
          "tenantId": {
            "type": "string",
            "example": "tenant-uuid"
          },
          "firstName": {
            "type": "string",
            "example": "John"
          },
          "lastName": {
            "type": "string",
            "example": "Doe"
          }
        },
        "required": [
          "email",
          "password"
        ]
      },
      "LoginDto": {
        "type": "object",
        "properties": {
          "email": {
            "type": "string",
            "example": "user@example.com"
          },
          "password": {
            "type": "string",
            "example": "SecureP@ssw0rd123!"
          },
          "tenantId": {
            "type": "string",
            "example": "tenant-uuid"
          }
        },
        "required": [
          "email",
          "password"
        ]
      },
      "ForgotPasswordDto": {
        "type": "object",
        "properties": {
          "email": {
            "type": "string",
            "example": "user@example.com"
          }
        },
        "required": [
          "email"
        ]
      },
      "ResetPasswordDto": {
        "type": "object",
        "properties": {
          "otp": {
            "type": "string",
            "example": "123456",
            "description": "6-digit OTP from email"
          },
          "password": {
            "type": "string",
            "example": "NewSecureP@ssw0rd123!"
          }
        },
        "required": [
          "otp",
          "password"
        ]
      },
      "SendMagicLinkDto": {
        "type": "object",
        "properties": {
          "email": {
            "type": "string",
            "example": "user@example.com"
          }
        },
        "required": [
          "email"
        ]
      },
      "VerifyMagicLinkDto": {
        "type": "object",
        "properties": {
          "token": {
            "type": "string",
            "description": "Raw magic link token from email URL"
          }
        },
        "required": [
          "token"
        ]
      },
      "SocialProviderDto": {
        "type": "object",
        "properties": {
          "provider": {
            "type": "string",
            "description": "Provider identifier",
            "example": "google"
          },
          "enabled": {
            "type": "boolean",
            "description": "Whether this provider is enabled for the tenant",
            "example": true
          },
          "displayName": {
            "type": "string",
            "description": "Human-readable display name",
            "example": "Google"
          }
        },
        "required": [
          "provider",
          "enabled"
        ]
      },
      "GetProvidersResponseDto": {
        "type": "object",
        "properties": {
          "password": {
            "type": "boolean",
            "description": "Password login enabled",
            "example": true
          },
          "magicLink": {
            "type": "boolean",
            "description": "Magic link login enabled",
            "example": false
          },
          "passkey": {
            "type": "boolean",
            "description": "Passkey (WebAuthn) login enabled",
            "example": false
          },
          "social": {
            "description": "Configured social providers",
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/SocialProviderDto"
            }
          }
        },
        "required": [
          "password",
          "magicLink",
          "passkey",
          "social"
        ]
      },
      "LoginIntentRequestDto": {
        "type": "object",
        "properties": {
          "email": {
            "type": "string",
            "description": "Email address to check for available authentication methods",
            "example": "john@example.com",
            "format": "email"
          }
        },
        "required": [
          "email"
        ]
      },
      "AuthMethodsDto": {
        "type": "object",
        "properties": {
          "password": {
            "type": "boolean",
            "description": "Whether password authentication is available",
            "example": true
          },
          "magicLink": {
            "type": "boolean",
            "description": "Whether magic link authentication is available",
            "example": true
          },
          "passkey": {
            "type": "boolean",
            "description": "Whether passkey (WebAuthn) authentication is available",
            "example": false
          },
          "mfa": {
            "type": "boolean",
            "description": "Whether multi-factor authentication is required",
            "example": true
          },
          "social": {
            "description": "List of available social authentication providers",
            "example": [
              "google",
              "github",
              "microsoft"
            ],
            "type": "array",
            "items": {
              "type": "string"
            }
          }
        },
        "required": [
          "password",
          "magicLink",
          "passkey",
          "mfa",
          "social"
        ]
      },
      "LoginBrandingDto": {
        "type": "object",
        "properties": {
          "logoUrl": {
            "type": "string",
            "description": "URL to company logo",
            "example": "https://cdn.example.com/logo.png"
          },
          "faviconUrl": {
            "type": "string",
            "description": "URL to favicon",
            "example": "https://cdn.example.com/favicon.ico"
          },
          "primaryColor": {
            "type": "string",
            "description": "Primary brand color",
            "example": "#0066FF"
          },
          "backgroundColor": {
            "type": "string",
            "description": "Background color",
            "example": "#FFFFFF"
          },
          "textColor": {
            "type": "string",
            "description": "Text color",
            "example": "#000000"
          },
          "buttonColor": {
            "type": "string",
            "description": "Button background color",
            "example": "#0066FF"
          },
          "buttonTextColor": {
            "type": "string",
            "description": "Button text color",
            "example": "#FFFFFF"
          },
          "companyName": {
            "type": "string",
            "description": "Company display name",
            "example": "Acme Corporation"
          },
          "supportEmail": {
            "type": "string",
            "description": "Support email",
            "example": "support@acme.com"
          },
          "privacyPolicyUrl": {
            "type": "string",
            "description": "Privacy policy URL",
            "example": "https://acme.com/privacy"
          },
          "termsOfServiceUrl": {
            "type": "string",
            "description": "Terms of service URL",
            "example": "https://acme.com/terms"
          }
        }
      },
      "LoginIntentResponseDto": {
        "type": "object",
        "properties": {
          "exists": {
            "type": "boolean",
            "description": "Whether a user with this email exists",
            "example": true
          },
          "email": {
            "type": "string",
            "description": "Email address that was checked",
            "example": "john@example.com"
          },
          "methods": {
            "description": "Available authentication methods for this user",
            "allOf": [
              {
                "$ref": "#/components/schemas/AuthMethodsDto"
              }
            ]
          },
          "preferredMethod": {
            "type": "string",
            "description": "Preferred authentication method (recommended to show first)",
            "example": "password",
            "enum": [
              "password",
              "magicLink",
              "passkey",
              "social"
            ]
          },
          "branding": {
            "description": "Tenant branding configuration for UI customization",
            "allOf": [
              {
                "$ref": "#/components/schemas/LoginBrandingDto"
              }
            ]
          }
        },
        "required": [
          "exists",
          "email",
          "methods"
        ]
      },
      "AcceptInviteDto": {
        "type": "object",
        "properties": {
          "token": {
            "type": "string",
            "example": "abc123...",
            "description": "128-hex invite token"
          },
          "name": {
            "type": "string",
            "example": "Jane Doe",
            "description": "Full name for the new account"
          },
          "password": {
            "type": "string",
            "example": "MySecurePass!123",
            "description": "Password for the new account"
          }
        },
        "required": [
          "token",
          "name",
          "password"
        ]
      },
      "TokenRequestDto": {
        "type": "object",
        "properties": {
          "grant_type": {
            "type": "string",
            "description": "OAuth2 grant type",
            "enum": [
              "authorization_code",
              "refresh_token",
              "client_credentials"
            ],
            "example": "authorization_code"
          },
          "code": {
            "type": "string",
            "description": "Authorization code (for authorization_code grant)",
            "example": "auth_code_abc123"
          },
          "redirect_uri": {
            "type": "string",
            "description": "Redirect URI (must match authorization request)",
            "example": "https://app.example.com/callback"
          },
          "refresh_token": {
            "type": "string",
            "description": "Refresh token (for refresh_token grant)",
            "example": "refresh_token_xyz789"
          },
          "client_id": {
            "type": "string",
            "description": "OAuth2 client ID",
            "example": "client_abc123"
          },
          "client_secret": {
            "type": "string",
            "description": "OAuth2 client secret (for confidential clients)",
            "example": "secret_xyz789"
          },
          "code_verifier": {
            "type": "string",
            "description": "PKCE code verifier (for public clients)",
            "example": "dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk"
          },
          "scope": {
            "type": "string",
            "description": "Requested scopes (for client_credentials grant)",
            "example": "api:read api:write"
          }
        },
        "required": [
          "grant_type",
          "client_id"
        ]
      },
      "TokenResponseDto": {
        "type": "object",
        "properties": {
          "access_token": {
            "type": "string",
            "description": "Access token (JWT)",
            "example": "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
          },
          "token_type": {
            "type": "string",
            "description": "Token type",
            "example": "Bearer"
          },
          "expires_in": {
            "type": "number",
            "description": "Expiration time in seconds",
            "example": 900
          },
          "refresh_token": {
            "type": "string",
            "description": "Refresh token (opaque)",
            "example": "refresh_token_xyz789"
          },
          "id_token": {
            "type": "string",
            "description": "ID token (JWT, OIDC only)",
            "example": "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
          },
          "scope": {
            "type": "string",
            "description": "Granted scopes",
            "example": "openid profile email"
          }
        },
        "required": [
          "access_token",
          "token_type",
          "expires_in"
        ]
      },
      "TokenErrorResponseDto": {
        "type": "object",
        "properties": {
          "error": {
            "type": "string",
            "description": "Error code",
            "enum": [
              "invalid_request",
              "invalid_client",
              "invalid_grant",
              "unauthorized_client",
              "unsupported_grant_type",
              "invalid_scope"
            ],
            "example": "invalid_grant"
          },
          "error_description": {
            "type": "string",
            "description": "Human-readable error description",
            "example": "The provided authorization code is invalid"
          },
          "error_uri": {
            "type": "string",
            "description": "URI with error information",
            "example": "https://docs.scrolloop.com/errors/invalid_grant"
          }
        },
        "required": [
          "error"
        ]
      },
      "UserInfoResponseDto": {
        "type": "object",
        "properties": {
          "sub": {
            "type": "string",
            "description": "Subject (user ID)",
            "example": "user_abc123"
          },
          "email": {
            "type": "string",
            "description": "Email address",
            "example": "user@example.com"
          },
          "email_verified": {
            "type": "boolean",
            "description": "Email verified",
            "example": true
          },
          "name": {
            "type": "string",
            "description": "Full name",
            "example": "John Doe"
          },
          "given_name": {
            "type": "string",
            "description": "Given name",
            "example": "John"
          },
          "family_name": {
            "type": "string",
            "description": "Family name",
            "example": "Doe"
          },
          "picture": {
            "type": "string",
            "description": "Profile picture URL",
            "example": "https://example.com/avatar.jpg"
          },
          "updated_at": {
            "type": "number",
            "description": "Last updated timestamp",
            "example": 1234567890
          }
        },
        "required": [
          "sub",
          "email",
          "email_verified"
        ]
      },
      "RevokeTokenRequestDto": {
        "type": "object",
        "properties": {
          "token": {
            "type": "string",
            "description": "Token to revoke",
            "example": "token_to_revoke"
          },
          "token_type_hint": {
            "type": "string",
            "description": "Token type hint",
            "enum": [
              "access_token",
              "refresh_token"
            ],
            "example": "access_token"
          }
        },
        "required": [
          "token"
        ]
      },
      "IntrospectTokenRequestDto": {
        "type": "object",
        "properties": {
