    "/auth/mfa/verify": {
      "post": {
        "description": "After receiving mfaRequired=true from login, use this endpoint to verify the TOTP code",
        "operationId": "AuthController_verifyMfa",
        "parameters": [
          {
            "name": "user-agent",
            "required": true,
            "in": "header",
            "schema": {
              "type": "string"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "tempToken": {
                    "type": "string",
                    "description": "Temporary token from login response"
                  },
                  "code": {
                    "type": "string",
                    "description": "6-digit TOTP code from authenticator app",
                    "pattern": "^\\d{6}$",
                    "example": "123456"
                  }
                },
                "required": [
                  "tempToken",
                  "code"
                ]
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "MFA verified successfully, tokens issued",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "accessToken": {
                      "type": "string"
                    },
                    "refreshToken": {
                      "type": "string"
                    },
                    "message": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          },
          "401": {
            "description": "Invalid MFA code or expired token"
          }
        },
        "summary": "Verify MFA code and complete login",
        "tags": [
          "Authentication"
        ]
      }
    },
    "/auth/mfa/verify-backup": {
      "post": {
        "description": "Use a backup code when authenticator app is unavailable",
        "operationId": "AuthController_verifyMfaBackup",
        "parameters": [
          {
            "name": "user-agent",
            "required": true,
            "in": "header",
            "schema": {
              "type": "string"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "tempToken": {
                    "type": "string",
                    "description": "Temporary token from login response"
                  },
                  "code": {
                    "type": "string",
                    "description": "Backup code in format XXXX-XXXX",
                    "pattern": "^[A-Z0-9]{4}-[A-Z0-9]{4}$",
                    "example": "ABCD-1234"
                  }
                },
                "required": [
                  "tempToken",
                  "code"
                ]
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Backup code verified, tokens issued",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "accessToken": {
                      "type": "string"
                    },
                    "refreshToken": {
                      "type": "string"
                    },
                    "message": {
                      "type": "string"
                    },
                    "warning": {
                      "type": "string",
                      "description": "Warning about remaining backup codes"
                    }
                  }
                }
              }
            }
          },
          "401": {
            "description": "Invalid backup code"
          }
        },
        "summary": "Verify MFA using backup code",
        "tags": [
          "Authentication"
        ]
      }
    },
