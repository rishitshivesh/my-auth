    "/auth/login-intent": {
      "post": {
        "description": "\n      Check what authentication methods are available for a given email address.\n      This is the first step in the email-first login flow.\n      \n      Returns:\n      - Whether the user exists\n      - Available authentication methods (password, magic link, passkey, social)\n      - Whether MFA is required\n      - Preferred authentication method\n      - Tenant branding information\n      \n      Use this to dynamically show the appropriate login options to the user.\n    ",
        "operationId": "AuthController_loginIntent",
        "parameters": [],
        "requestBody": {
          "required": true,
          "description": "Email address to check",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/LoginIntentRequestDto"
              },
              "examples": {
                "Existing User": {
                  "value": {
                    "email": "john@example.com"
                  }
                },
                "New User": {
                  "value": {
                    "email": "newuser@example.com"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Available authentication methods returned successfully",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/LoginIntentResponseDto"
                },
                "examples": {
                  "Existing User with Multiple Methods": {
                    "summary": "Existing User with Multiple Methods",
                    "value": {
                      "exists": true,
                      "email": "john@example.com",
                      "methods": {
                        "password": true,
                        "magicLink": true,
                        "passkey": false,
                        "mfa": true,
                        "social": [
                          "google",
                          "github"
                        ]
                      },
                      "preferredMethod": "password",
                      "branding": {
                        "logoUrl": "https://cdn.example.com/logo.png",
                        "primaryColor": "#0066FF",
                        "backgroundColor": "#FFFFFF",
                        "textColor": "#000000",
                        "buttonColor": "#0066FF",
                        "buttonTextColor": "#FFFFFF",
                        "companyName": "Acme Corp",
                        "supportEmail": "support@acme.com"
                      }
                    }
                  },
                  "New User (Signup)": {
                    "summary": "New User (Signup)",
                    "value": {
                      "exists": false,
                      "email": "newuser@example.com",
                      "methods": {
                        "password": true,
                        "magicLink": false,
                        "passkey": false,
                        "mfa": false,
                        "social": [
                          "google",
                          "github"
                        ]
                      },
                      "preferredMethod": "password",
                      "branding": {
                        "primaryColor": "#0066FF",
                        "backgroundColor": "#FFFFFF",
                        "companyName": "Acme Corp"
                      }
                    }
                  },
                  "Legacy User (Password Only)": {
                    "summary": "Legacy User (Password Only)",
                    "value": {
                      "exists": true,
                      "email": "legacy@example.com",
                      "methods": {
                        "password": true,
                        "magicLink": false,
                        "passkey": false,
                        "mfa": false,
                        "social": []
                      },
                      "preferredMethod": "password"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Invalid email format",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "statusCode": {
                      "type": "number",
                      "example": 400
                    },
                    "message": {
                      "type": "string",
                      "example": "Invalid email format"
                    },
                    "error": {
                      "type": "string",
                      "example": "Bad Request"
                    }
                  }
                }
              }
            }
          },
          "404": {
            "description": "Tenant not found",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "statusCode": {
                      "type": "number",
                      "example": 404
                    },
                    "message": {
                      "type": "string",
                      "example": "Tenant not found"
                    },
                    "error": {
                      "type": "string",
                      "example": "Not Found"
                    }
                  }
                }
              }
            }
          }
        },
        "summary": "Check available authentication methods",
        "tags": [
          "Authentication"
        ]
      }
