    "/oauth/authorize": {
      "get": {
        "description": "Initiate OAuth2 authorization code flow. User must be logged in.",
        "operationId": "OAuthController_authorize",
        "parameters": [
          {
            "name": "client_id",
            "required": true,
            "in": "query",
            "description": "OAuth2 client ID",
            "schema": {
              "example": "client_abc123",
              "type": "string"
            }
          },
          {
            "name": "redirect_uri",
            "required": true,
            "in": "query",
            "description": "OAuth2 redirect URI",
            "schema": {
              "example": "https://app.example.com/callback",
              "type": "string"
            }
          },
          {
            "name": "response_type",
            "required": true,
            "in": "query",
            "description": "OAuth2 response type",
            "schema": {
              "enum": [
                "code"
              ],
              "type": "string"
            }
          },
          {
            "name": "scope",
            "required": true,
            "in": "query",
            "description": "Space-separated list of scopes",
            "schema": {
              "example": "openid profile email",
              "type": "string"
            }
          },
          {
            "name": "state",
            "required": false,
            "in": "query",
            "description": "OAuth2 state parameter for CSRF protection",
            "schema": {
              "example": "random_state_xyz",
              "type": "string"
            }
          },
          {
            "name": "nonce",
            "required": false,
            "in": "query",
            "description": "OIDC nonce parameter for replay protection",
            "schema": {
              "example": "random_nonce_abc",
              "type": "string"
            }
          },
          {
            "name": "code_challenge",
            "required": false,
            "in": "query",
            "description": "PKCE code challenge",
            "schema": {
              "example": "E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM",
              "type": "string"
            }
          },
          {
            "name": "code_challenge_method",
            "required": false,
            "in": "query",
            "description": "PKCE code challenge method",
            "schema": {
              "enum": [
                "S256",
                "plain"
              ],
              "type": "string"
            }
          }
        ],
        "responses": {
          "302": {
            "description": "Redirects to redirect_uri with code and state"
          },
          "400": {
            "description": "Invalid request parameters"
          }
        },
        "summary": "OAuth2 Authorization Endpoint",
        "tags": [
          "OAuth2/OIDC"
        ]
      }
    },
